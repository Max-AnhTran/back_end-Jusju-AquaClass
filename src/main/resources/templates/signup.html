<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Sign Up - AquaClass</title>
        <meta charset="UTF-8" />
        <!-- Bootstrap 5 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            crossorigin="anonymous"
        />
        <style>
            body {
                background: linear-gradient(to right, #56ccf2, #2f80ed);
            }
            .signup-container {
                max-width: 400px;
                margin: auto;
                padding: 2rem;
            }
            .card {
                border-radius: 15px;
                padding: 2rem;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }
            .form-control:focus {
                border-color: #2f80ed;
                box-shadow: 0 0 5px rgba(47, 128, 237, 0.5);
            }
            .btn-primary {
                background-color: #2f80ed;
                border: none;
            }
            .btn-primary:hover {
                background-color: #1e5ab7;
            }
            .btn-secondary {
                background-color: #56ccf2;
                border: none;
            }
            .btn-secondary:hover {
                background-color: #45b8e0;
            }
        </style>
    </head>
    <body class="d-flex justify-content-center align-items-center vh-100">
        <div class="container">
            <div class="signup-container">
                <div class="card">
                    <h2 class="text-center mb-4">Sign Up - AquaClass</h2>

                    <form th:object="${signupform}" th:action="@{/saveuser}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">User Name:</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" required />
                            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></p>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" required />
                            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></p>
                        </div>
                        <div class="mb-3">
                            <label for="passwordCheck" class="form-label">Confirm Password:</label>
                            <input type="password" id="passwordCheck" th:field="*{passwordCheck}" class="form-control" required />
                            <p th:if="${#fields.hasErrors('passwordCheck')}" th:errors="*{passwordCheck}" class="text-danger"></p>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" required />
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></p>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>

                    <hr />
                    <a th:href="@{/login}" class="btn btn-secondary w-100">Sign In</a>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-Js4Ik86/BtvRdH79/tLf4psYoHt3BvoKl5RSceOHwRj5hhjDIEHR98R2GmSgihzO"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
