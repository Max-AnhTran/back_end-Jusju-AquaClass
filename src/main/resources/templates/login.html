<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
    <head>
        <title>AquaClass - Login</title>
        <meta charset="UTF-8" />
        <!-- Bootstrap 5 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            crossorigin="anonymous"
        />
        <style>
            body {
                background: linear-gradient(to right, #56ccf2, #2f80ed);
            }
            .login-container {
                max-width: 400px;
                margin: auto;
                padding: 2rem;
            }
            .card {
                border-radius: 15px;
                padding: 2rem;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }
            .btn-primary {
                background-color: #2f80ed;
                border: none;
            }
            .btn-primary:hover {
                background-color: #1e5ab7;
            }
            .btn-secondary {
                background-color: #56ccf2;
                border: none;
            }
            .btn-secondary:hover {
                background-color: #45b8e0;
            }
        </style>
    </head>
    <body class="d-flex justify-content-center align-items-center vh-100">
        <div class="container">
            <div class="login-container">
                <div class="card">
                    <h2 class="text-center mb-4">Sign in - AquaClass</h2>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Invalid username and password. Please try again.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">User Name:</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password:</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                required
                            />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>

                    <hr />
                    <a th:href="@{/signup}" class="btn btn-secondary w-100">Sign-up</a>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-Js4Ik86/BtvRdH79/tLf4psYoHt3BvoKl5RSceOHwRj5hhjDIEHR98R2GmSgihzO"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
